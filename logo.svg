<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="围棋">
  <defs>
    <linearGradient id="wq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2620"/>
      <stop offset="100%" stop-color="#171512"/>
    </linearGradient>
    <linearGradient id="wq-wood" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d9ab63"/>
      <stop offset="100%" stop-color="#c1913f"/>
    </linearGradient>
    <radialGradient id="wq-black" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5a5a5c"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="wq-white" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9c9c4"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect width="128" height="128" rx="28" fill="url(#wq-bg)"/>

  <!-- 棋盘 -->
  <g>
    <rect x="16" y="16" width="96" height="96" rx="8" fill="url(#wq-wood)"/>
    <!-- 网格 -->
    <g stroke="#4a3316" stroke-width="1.6" opacity="0.8">
      <line x1="26" y1="26" x2="26" y2="102"/>
      <line x1="41" y1="26" x2="41" y2="102"/>
      <line x1="56" y1="26" x2="56" y2="102"/>
      <line x1="71" y1="26" x2="71" y2="102"/>
      <line x1="86" y1="26" x2="86" y2="102"/>
      <line x1="101" y1="26" x2="101" y2="102"/>
      <line x1="26" y1="26" x2="102" y2="26"/>
      <line x1="26" y1="41" x2="102" y2="41"/>
      <line x1="26" y1="56" x2="102" y2="56"/>
      <line x1="26" y1="71" x2="102" y2="71"/>
      <line x1="26" y1="86" x2="102" y2="86"/>
      <line x1="26" y1="102" x2="102" y2="102"/>
    </g>
    <!-- 加粗外框与天元线 -->
    <rect x="26" y="26" width="76" height="76" fill="none" stroke="#3d2a10" stroke-width="2.6"/>
    <line x1="64" y1="26" x2="64" y2="102" stroke="#4a3316" stroke-width="1.2" opacity="0.7"/>
    <line x1="26" y1="64" x2="102" y2="64" stroke="#4a3316" stroke-width="1.2" opacity="0.7"/>
    <!-- 星位 -->
    <g fill="#3d2a10">
      <circle cx="34" cy="34" r="2.4"/>
      <circle cx="94" cy="34" r="2.4"/>
      <circle cx="34" cy="94" r="2.4"/>
      <circle cx="94" cy="94" r="2.4"/>
      <circle cx="64" cy="64" r="2.4"/>
    </g>
    <!-- 棋子：黑、白、黑对角布局 -->
    <circle cx="41" cy="41" r="11" fill="url(#wq-black)"/>
    <circle cx="86" cy="86" r="11" fill="url(#wq-black)"/>
    <circle cx="86" cy="41" r="11" fill="url(#wq-white)" stroke="#8a8a85" stroke-width="0.8"/>
    <!-- 白子高光 -->
    <circle cx="82.5" cy="37.5" r="3" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
