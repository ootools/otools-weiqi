<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>围棋 · OTools</title>
  <link rel="icon" type="image/svg+xml" href="../logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /*
     * OTools 宿主桥（插件唯一需要写的 JS）。
     * ------------------------------------------------------------------
     * 宿主注入了两条能力通道，任一条通就算「在 OTools 里」：
     *   1. `window.otools` / `window.utools`：宿主包装 API（dialog.open/save + readHostFile/writeHostFile）。
     *   2. `window.__TAURI_INTERNALS__.invoke`：Tauri 原生 IPC（tools_webview_* 命令）。
     * 两条都不通（把 dist 拖进普通浏览器）就退回浏览器原生行为。
     *
     * 本插件用宿主桥实现 SGF 棋谱的导入（openText）与导出（saveText）；
     * 普通浏览器里退化为 <input type=file> 与下载。
     */
    (function () {
      function base64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      function bytesToBase64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function baseName(p) {
        var s = String(p || '');
        var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
        return i >= 0 ? s.slice(i + 1) : s;
      }

      function wrapper() {
        var a = (typeof window !== 'undefined' && (window.otools || window.utools)) || null;
        return a && a.dialog && typeof a.dialog.open === 'function' && typeof a.readHostFile === 'function' ? a : null;
      }
      function tauriInvoke() {
        var candidates = [window];
        try { if (window.parent && window.parent !== window) candidates.push(window.parent); } catch (e) {}
        try { if (window.top && window.top !== window) candidates.push(window.top); } catch (e) {}
        for (var i = 0; i < candidates.length; i++) {
          var t = candidates[i] && candidates[i].__TAURI_INTERNALS__;
          if (t && typeof t.invoke === 'function') return t.invoke.bind(t);
        }
        return null;
      }
      function hostReady() { return !!wrapper() || !!tauriInvoke(); }
      function fail(msg) { return Promise.reject(new Error(msg)); }

      function readHostFile(path) {
        var a = wrapper();
        if (a) return a.readHostFile(path);
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 宿主不可用');
        return invoke('tools_webview_read_file', { path: path });
      }
      function writeHostFile(path, dataBase64) {
        var invoke = tauriInvoke();
        if (invoke) {
          return invoke('tools_webview_write_file', { request: { path: path, dataBase64: dataBase64 } }).catch(function (e) {
            var a = wrapper();
            if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
            throw e;
          });
        }
        var a = wrapper();
        if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
        return fail('OTools 宿主不可用');
      }
      function pickOpenPath(filters) {
        var a = wrapper();
        if (a) return a.dialog.open({ directory: false, multiple: false, title: '打开文件', filters: filters }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 打开文件对话框不可用');
        return invoke('tools_webview_pick_files', { options: { multiple: false, title: '打开文件', filters: filters } }).then(function (files) {
          var list = Array.isArray(files) ? files : (files ? [files] : []);
          var first = list[0];
          return first ? (typeof first === 'string' ? first : (first.path || null)) : null;
        });
      }
      function pickSavePath(defaultPath, filters) {
        var a = wrapper();
        if (a) return a.dialog.save({ title: '保存文件', defaultPath: defaultPath, filters: filters || [{ name: '文本', extensions: ['txt'] }] }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 保存对话框不可用');
        var sp = String(defaultPath || '').match(/^(.*[\\/])?([^\\/]+)$/);
        return invoke('tools_webview_pick_save_path', {
          options: { title: '保存文件', suggestedName: sp ? sp[2] : defaultPath, directory: sp ? sp[1].replace(/[\\/]+$/, '') : undefined, filters: filters || [{ name: '文本', extensions: ['txt'] }] },
        }).then(function (meta) { return meta ? (typeof meta === 'string' ? meta : (meta.path || null)) : null; });
      }

      // 暴露给页面其它脚本（也暴露给 WASM 侧）的统一桥。
      window.otoolsPlugin = {
        available: function () { return hostReady(); },
        theme: function () {
          var cl = document.documentElement && document.documentElement.classList;
          if (!cl) return '';
          if (cl.contains('dark')) return 'dark';
          if (cl.contains('light')) return 'light';
          return '';
        },
        language: function () {
          try {
            return (window.__OTOOLS_LOCALE__ && window.__OTOOLS_LOCALE__.locale) ||
              (document.documentElement && document.documentElement.lang) ||
              (typeof navigator !== 'undefined' && navigator.language) || '';
          } catch (e) { return ''; }
        },
        openText: function (filters) {
          if (!hostReady()) return fail('OTools 打开文件对话框不可用');
          return pickOpenPath(filters || [{ name: '文本', extensions: ['txt', 'json', 'md'] }]).then(function (path) {
            if (!path) return null;
            return readHostFile(path).then(function (file) {
              var dataBase64 = (file && file.dataBase64) || '';
              return { name: (file && file.name) || baseName(path), path: path, text: atob(dataBase64) };
            });
          });
        },
        saveText: function (name, text, filters) {
          if (!hostReady()) return fail('OTools 保存对话框不可用');
          return pickSavePath(name, filters).then(function (path) {
            if (!path) return null;
            return writeHostFile(path, bytesToBase64(new TextEncoder().encode(text))).then(function () { return path; });
          });
        },
      };
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-stone black"></span><span class="brand-stone white"></span>围棋 <span class="sub">OTools Weiqi</span></div>
      <div class="topbar-right">对弈 · 排盘 · 学棋</div>
    </header>
    <main class="layout">
      <section class="board-pane">
        <div class="board-wrap"><canvas id="board"></canvas></div>
        <div class="board-caption">
          <span id="play-status" class="caption-main"></span>
        </div>
      </section>
      <aside class="side">
        <nav class="tabs">
          <button id="tab-play" class="tab active">对弈</button>
          <button id="tab-records" class="tab">排盘</button>
          <button id="tab-learn" class="tab">学棋</button>
        </nav>

        <!-- 对弈 -->
        <section id="panel-play" class="panel active">
          <div class="row settings">
            <label>棋盘 <select id="sel-size"><option value="19">19 路</option><option value="13">13 路</option><option value="9">9 路</option></select></label>
            <label>贴目 <select id="sel-komi"><option value="7.5">7.5</option><option value="6.5">6.5</option><option value="5.5">5.5</option><option value="0">0</option></select></label>
            <label>让子 <select id="sel-handicap"><option value="0">0</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label>
            <button id="btn-new">新对局</button>
          </div>
          <div class="row settings">
            <label>模式 <select id="sel-mode">
              <option value="pvp" selected>双人对弈</option>
              <option value="ai-black">人机 · AI 执黑</option>
              <option value="ai-white">人机 · AI 执白</option>
            </select></label>
            <label>AI 难度 <select id="sel-ai-level">
              <option value="easy">入门</option>
              <option value="normal" selected>普通</option>
              <option value="hard">困难</option>
            </select></label>
          </div>
          <div class="row actions">
            <button id="btn-pass">虚手</button>
            <button id="btn-undo">悔棋</button>
            <button id="btn-redo">前进</button>
            <span class="spacer"></span>
            <button id="btn-import">导入 SGF</button>
            <button id="btn-export">导出 SGF</button>
          </div>
          <div id="marking-box" class="marking hidden">
            <div>双方连续虚手，进入<strong>死子标记</strong>阶段：点击棋子标记 / 取消死子。</div>
            <div class="row">
              <button id="btn-score-now">计算结果</button>
              <button id="btn-skip-dead">跳过死子直接数子</button>
              <button id="btn-resume">继续对局</button>
            </div>
          </div>
          <div id="play-result" class="result hidden"></div>
          <p class="hint">点击棋盘落子；最后一手有圆圈标记。人机模式下轮到 AI 时显示「对手思考中…」并锁定落子，悔棋一次撤回 AI 与你的两手；双方连续虚手后标记死子、数子定胜负。对局自动保存在本地，下次打开继续。</p>
        </section>

        <!-- 排盘 -->
        <section id="panel-records" class="panel">
          <select id="sel-game" class="full"></select>
          <div id="game-meta" class="meta"></div>
          <div class="row replay-controls">
            <button id="btn-first">首</button>
            <button id="btn-prev">上一手</button>
            <button id="btn-next">下一手</button>
            <button id="btn-last">末</button>
            <button id="btn-auto">自动播放</button>
            <select id="sel-speed"><option value="slow">慢</option><option value="normal" selected>中</option><option value="fast">快</option></select>
            <label class="chk"><input type="checkbox" id="chk-num">手数</label>
          </div>
          <div id="rec-movecount" class="movecount"></div>
          <ol id="move-list" class="move-list"></ol>
          <div id="rec-comment" class="comment"></div>
          <div id="rec-load-error" class="load-error hidden"></div>
        </section>

        <!-- 学棋 -->
        <section id="panel-learn" class="panel">
          <div id="chapter-index" class="chapter-index"></div>
          <div class="row chapter-nav">
            <button id="btn-chapter-prev">上一章</button>
            <span id="chapter-title" class="chapter-title"></span>
            <button id="btn-chapter-next">下一章</button>
          </div>
          <div id="chapter-body" class="chapter-body"></div>
          <div id="demo-notice" class="notice hidden"></div>
          <div class="row demo-controls">
            <button id="btn-demo-reset">重置演示</button>
            <button id="btn-demo-next">下一步</button>
            <span id="demo-caption" class="demo-caption"></span>
          </div>
        </section>
      </aside>
    </main>
  </div>
  <input type="file" id="file-fallback" accept=".sgf,text/*" hidden>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
